name: lifedrop_admin_web
description: LifeDrop Admin Dashboard - Flutter Web
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.24.0
  cloud_firestore: ^4.14.0
  firebase_auth: ^4.16.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.7.0

  flutter_web_plugins:
    sdk: flutter

  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.6.0
  fl_chart: ^0.63.0

  provider: ^6.0.5

  intl: ^0.18.1
  url_launcher: ^6.1.14
  image_picker: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/LOGO_PIC.png


